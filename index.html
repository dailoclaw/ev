<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f3f5f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EV Dashboard" />
    
    <!-- iOS App Icon -->
    <link rel="apple-touch-icon" href="/icon.jpg" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.jpg" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon.jpg" />
    
    <!-- iOS Splash Screen -->
    <link rel="apple-touch-startup-image" href="/splash.jpg" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>EV Charging Dashboard</title>
    <meta name="description" content="Track your electric vehicle charging costs and usage patterns" />

    <!-- Apply saved theme before first paint to avoid a flash of the wrong theme -->
    <script>
      try {
        if (localStorage.getItem('ev.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', '#000000')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
