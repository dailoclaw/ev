<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EV Command Click-to-Review Animation Mockups</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f3f5f7;
      --surf: #ffffff;
      --surf2: #f7f9fa;
      --bd: #e3e8ec;
      --bd2: #edf1f3;
      --tx: #0f1a24;
      --mut: #4e5e6b;
      --fnt: #8496a3;
      --money: #059669;
      --money-deep: #047857;
      --money-soft: #e7f6ef;
      --money-line: #b8e6d0;
      --steel: #334155;
      --neg: #e11d48;
      --warn: #b45309;
      --radius: 16px;
      --radius-sm: 12px;
      --cardshadow: 0 1px 2px rgba(15, 26, 36, 0.05), 0 10px 24px rgba(15, 26, 36, 0.07);
      --sheetshadow: 0 -14px 40px rgba(15, 26, 36, 0.30);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--tx);
      background:
        radial-gradient(circle at 12% -8%, rgba(5, 150, 105, 0.15), transparent 28%),
        radial-gradient(circle at 90% 0%, rgba(51, 65, 85, 0.12), transparent 30%),
        var(--canvas);
    }
    button {
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 2px solid rgba(5, 150, 105, 0.75);
      outline-offset: 3px;
    }

    .page {
      width: min(100%, 1220px);
      margin: 0 auto;
      padding: 28px 16px 54px;
    }
    .cover {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      margin-bottom: 18px;
    }
    .eyebrow,
    .cap {
      display: block;
      color: var(--money);
      font-size: 10.5px;
      font-weight: 850;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }
    .cap { color: var(--fnt); }
    h1 {
      margin: 6px 0 0;
      font-size: clamp(34px, 6vw, 68px);
      line-height: 0.94;
      letter-spacing: -0.055em;
    }
    .lead {
      max-width: 760px;
      margin: 12px 0 0;
      color: var(--mut);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 620;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .pill,
    .run-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 8px 12px;
      border: 1px solid var(--bd);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--mut);
      box-shadow: var(--cardshadow);
      font-size: 12px;
      font-weight: 850;
      transition: transform 140ms ease, background 160ms ease, color 160ms ease;
    }
    .pill:hover,
    .run-btn:hover { transform: translateY(-1px); }
    .pill.on,
    .run-btn {
      color: #fff;
      background: var(--steel);
      border-color: var(--steel);
    }
    .run-btn.active {
      background: linear-gradient(135deg, var(--money), #0d9488);
      border-color: transparent;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .mock {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--bd);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.74);
      box-shadow: var(--cardshadow);
    }
    .mock-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 64px;
      padding: 13px 14px;
      border-bottom: 1px solid rgba(227, 232, 236, 0.72);
    }
    .mock-head h2 {
      margin: 0;
      font-size: 14.5px;
      line-height: 1.18;
      letter-spacing: -0.018em;
    }
    .mock-head span {
      display: block;
      margin-top: 3px;
      color: var(--fnt);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .stage {
      position: relative;
      min-height: 458px;
      display: grid;
      place-items: center;
      padding: 16px;
      background:
        radial-gradient(circle at 16% 0%, rgba(5, 150, 105, 0.08), transparent 30%),
        linear-gradient(180deg, rgba(255,255,255,0.52), rgba(247,249,250,0.94));
    }
    .note {
      margin-top: 10px;
      color: var(--mut);
      font-size: 11.5px;
      line-height: 1.45;
      font-weight: 650;
    }

    .phone {
      position: relative;
      width: min(100%, 292px);
      height: 424px;
      overflow: hidden;
      border: 1px solid var(--bd);
      border-radius: 28px;
      background: var(--canvas);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.72), 0 18px 42px rgba(15,26,36,0.18);
      padding: 14px 12px 58px;
    }
    .appbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }
    .appbar h3 {
      margin: 4px 0 0;
      font-size: 25px;
      line-height: 0.98;
      letter-spacing: -0.035em;
    }
    .sub {
      margin: 4px 0 0;
      color: var(--mut);
      font-size: 11.5px;
      line-height: 1.42;
      font-weight: 630;
    }
    .icon {
      width: 38px;
      height: 38px;
      border: 1px solid var(--bd);
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: var(--surf);
      color: var(--steel);
      box-shadow: var(--cardshadow);
      font-size: 13px;
      font-weight: 850;
    }
    .tabbar {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      border: 1px solid var(--bd);
      border-radius: 19px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 12px 24px rgba(15,26,36,0.14);
    }
    .tabbar i {
      display: block;
      width: 18px;
      height: 18px;
      border-radius: 8px;
      background: var(--bd2);
      transition: background 220ms ease, transform 220ms ease;
    }
    .tabbar i.on {
      background: var(--money);
      transform: translateY(-1px);
    }
    .tabbar i.fab {
      width: 34px;
      height: 34px;
      border-radius: 15px;
      background: var(--steel);
      box-shadow: 0 10px 20px rgba(51,65,85,0.24);
    }

    .hero-card,
    .chart-card,
    .metric-card,
    .row {
      border: 1px solid var(--bd);
      background: var(--surf);
      box-shadow: var(--cardshadow);
    }
    .hero-card,
    .chart-card {
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 9px;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 9px;
    }
    .metric-card {
      min-height: 70px;
      padding: 11px;
      border-radius: var(--radius-sm);
    }
    .metric-card b {
      display: block;
      margin-top: 5px;
      font-size: 17px;
      letter-spacing: -0.025em;
    }
    .big {
      display: block;
      margin-top: 6px;
      font-size: 35px;
      line-height: 0.95;
      letter-spacing: -0.04em;
      font-weight: 850;
    }
    .delta {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--money-soft);
      color: var(--money-deep);
      font-size: 10px;
      font-weight: 850;
      white-space: nowrap;
    }
    .mark {
      width: 34px;
      height: 34px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--pc, var(--money));
      color: #fff;
      box-shadow: 0 4px 10px color-mix(in srgb, var(--pc, var(--money)) 40%, transparent);
      font-size: 14px;
      font-weight: 850;
    }
    .row {
      width: 100%;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
      padding: 11px;
      border-radius: var(--radius-sm);
      text-align: left;
    }
    .row strong {
      display: block;
      font-size: 13px;
      font-weight: 850;
    }
    .row small {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: var(--mut);
      font-size: 10.5px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .amt {
      color: var(--steel);
      font-size: 13px;
      font-weight: 850;
      white-space: nowrap;
    }
    .primary {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 40px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--money), #0d9488);
      color: #fff;
      box-shadow: 0 12px 24px rgba(5,150,105,0.28);
      font-size: 13px;
      font-weight: 850;
    }
    .seg {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--bd);
      border-radius: 13px;
      background: var(--surf2);
      margin-bottom: 9px;
    }
    .seg button {
      min-height: 32px;
      border-radius: 9px;
      color: var(--mut);
      font-size: 11.5px;
      font-weight: 820;
      transition: background 220ms ease, color 220ms ease, transform 220ms ease;
    }
    .seg button.on {
      background: var(--steel);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(51,65,85,0.18);
    }

    .savecard {
      position: relative;
      min-height: 126px;
      overflow: hidden;
      border-radius: var(--radius);
      padding: 15px 98px 15px 15px;
      margin-bottom: 9px;
      color: #fff;
      background: linear-gradient(140deg, #047857, #059669 55%, #0d9488);
      box-shadow: 0 14px 30px rgba(5,150,105,0.32);
    }
    .savecard .cap { color: rgba(255,255,255,0.76); }
    .savecard .sub { color: rgba(255,255,255,0.88); }
    .savecard::after {
      content: "";
      position: absolute;
      right: -20px;
      top: -22px;
      width: 112px;
      height: 112px;
      border: 16px solid rgba(255,255,255,0.12);
      border-radius: 36px;
      transform: rotate(14deg);
    }

    .donut {
      --p: 0;
      --size: 96px;
      position: relative;
      width: var(--size);
      height: var(--size);
      display: grid;
      place-items: center;
      flex: none;
      border-radius: 50%;
      background: conic-gradient(var(--money) calc(var(--p) * 1%), var(--bd2) 0);
      transition: --p 900ms cubic-bezier(0.28, 1, 0.32, 1);
    }
    @property --p { syntax: "<number>"; initial-value: 0; inherits: true; }
    .donut::before {
      content: "";
      position: absolute;
      inset: 11px;
      border-radius: 50%;
      background: var(--surf);
      box-shadow: inset 0 0 0 1px var(--bd2);
    }
    .donut b {
      position: relative;
      font-size: 18px;
      letter-spacing: -0.02em;
    }
    .savecard .donut {
      --size: 72px;
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: conic-gradient(#fff calc(var(--p) * 1%), rgba(255,255,255,0.22) 0);
      z-index: 1;
    }
    .savecard .donut::before { background: #058662; }
    .savecard .donut b { color: #fff; font-size: 14px; }

    .thermo {
      position: relative;
      height: 14px;
      margin-top: 12px;
      overflow: hidden;
      border: 1px solid var(--bd);
      border-radius: 999px;
      background: var(--surf2);
    }
    .thermo i {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--money), #34d399);
      transition: width 900ms cubic-bezier(0.28, 1, 0.32, 1);
    }
    .thermo b {
      position: absolute;
      top: -5px;
      width: 3px;
      height: 22px;
      border-radius: 4px;
      background: var(--warn);
      transform: translateX(-50%) scaleY(0);
      transition: transform 360ms ease 500ms;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 8px;
      color: var(--mut);
      font-size: 10px;
      font-weight: 800;
    }
    .legend i {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 5px;
      border-radius: 3px;
      vertical-align: -1px;
    }
    .splitbar {
      display: flex;
      height: 12px;
      margin: 14px 0 9px;
      overflow: hidden;
      border: 1px solid var(--bd);
      border-radius: 999px;
      background: var(--surf2);
    }
    .splitbar i {
      width: 0;
      height: 100%;
      transition: width 850ms cubic-bezier(0.28, 1, 0.32, 1);
    }
    .bars {
      height: 112px;
      display: flex;
      align-items: end;
      gap: 6px;
      padding-top: 22px;
    }
    .bars i {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 4px;
      border-radius: 7px 7px 3px 3px;
      background: linear-gradient(180deg, var(--money), color-mix(in srgb, var(--money) 30%, var(--surf)));
      transition: height 820ms cubic-bezier(0.28, 1, 0.32, 1);
    }
    .bars i::before {
      content: attr(data-v);
      position: absolute;
      left: 50%;
      top: -18px;
      transform: translateX(-50%);
      color: var(--steel);
      font-size: 9px;
      font-weight: 850;
      opacity: 0;
      transition: opacity 240ms ease 540ms;
    }
    .spark {
      width: 100%;
      height: 116px;
      margin-top: 2px;
    }
    .spark .area {
      fill: var(--money);
      opacity: 0;
      transition: opacity 400ms ease 520ms;
    }
    .spark .line {
      fill: none;
      stroke: var(--money);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 420;
      stroke-dashoffset: 420;
      transition: stroke-dashoffset 1000ms cubic-bezier(0.35, 0.8, 0.25, 1);
    }

    .swiperow {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-sm);
    }
    .swipe-actions {
      position: absolute;
      inset: 0 0 0 auto;
      display: flex;
    }
    .swipe-actions button {
      width: 44px;
      color: #fff;
      font-size: 11px;
      font-weight: 850;
    }
    .swipe-actions .edit { background: var(--steel); }
    .swipe-actions .del { background: var(--neg); }
    .swipe-content {
      position: relative;
      z-index: 1;
      margin-bottom: 0;
      transition: transform 260ms ease;
    }
    .receipt {
      padding: 14px;
      border: 1px solid var(--bd);
      border-radius: var(--radius);
      background: var(--surf);
      box-shadow: var(--cardshadow);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      transform-style: preserve-3d;
      transition: transform 680ms cubic-bezier(0.28, 1, 0.32, 1);
    }
    .rl {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
      color: var(--mut);
      font-size: 12px;
    }
    .rl b { color: var(--tx); }
    .rl.free,
    .rl.free b { color: var(--money-deep); }
    .rl.tot {
      margin-top: 7px;
      padding-top: 10px;
      border-top: 1.5px dashed var(--bd);
      font-weight: 850;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: end;
      padding: 10px;
      background: rgba(15,26,36,0);
      pointer-events: none;
      transition: background 300ms ease;
      z-index: 5;
    }
    .sheet {
      width: 100%;
      padding: 10px 14px 14px;
      border: 1px solid var(--bd);
      border-radius: 22px;
      background: var(--surf);
      box-shadow: var(--sheetshadow);
      transform: translateY(114%);
      transition: transform 520ms cubic-bezier(0.28, 1.32, 0.28, 1);
    }
    .handle {
      width: 42px;
      height: 4px;
      margin: 0 auto 12px;
      border-radius: 99px;
      background: var(--bd);
    }
    label {
      display: block;
      margin: 10px 0 5px;
      color: var(--fnt);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .fld {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 36px;
      padding: 0 11px;
      border: 1px solid var(--bd);
      border-radius: 11px;
      background: var(--surf2);
      color: var(--tx);
      font-size: 13px;
      font-weight: 760;
    }
    .fld span {
      color: var(--fnt);
      font-size: 10.5px;
      font-weight: 850;
    }
    .provider-card {
      position: relative;
      overflow: hidden;
      padding: 14px;
      border: 1px solid var(--bd);
      border-radius: var(--radius);
      background: var(--surf);
      box-shadow: var(--cardshadow);
    }
    .provider-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--pc, var(--money));
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 620ms ease;
    }
    .provider-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .ratebadge {
      border-radius: 999px;
      padding: 5px 8px;
      background: var(--money-soft);
      color: var(--money-deep);
      font-size: 10px;
      font-weight: 850;
    }
    .mini-meter {
      height: 8px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surf2);
    }
    .mini-meter i {
      display: block;
      width: 0;
      height: 100%;
      background: var(--pc, var(--money));
      transition: width 780ms ease 160ms;
    }
    .battery {
      position: relative;
      width: 96px;
      height: 44px;
      margin: 0 auto 14px;
      border: 3px solid var(--bd);
      border-radius: 13px;
    }
    .battery::after {
      content: "";
      position: absolute;
      right: -10px;
      top: 13px;
      width: 7px;
      height: 14px;
      border-radius: 0 5px 5px 0;
      background: var(--bd);
    }
    .battery i {
      display: block;
      width: 0;
      height: 100%;
      border-radius: 9px;
      background: linear-gradient(90deg, var(--money), #34d399);
      transition: width 900ms cubic-bezier(0.28, 1, 0.32, 1);
    }
    .empty {
      min-height: 210px;
      display: grid;
      place-items: center;
      padding: 20px;
      border: 1px dashed var(--bd);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.62);
      text-align: center;
    }
    .toast {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 58px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 11px 13px;
      border-radius: var(--radius-sm);
      background: #0f1a24;
      color: #fff;
      box-shadow: var(--cardshadow);
      transform: translateY(74px);
      opacity: 0;
      transition: transform 340ms ease, opacity 240ms ease;
      font-size: 12px;
      font-weight: 850;
      z-index: 8;
    }
    .toast button {
      color: #34d399;
      font-size: 12px;
      font-weight: 850;
    }
    .screen-card {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 420ms ease, transform 420ms cubic-bezier(0.28, 1, 0.32, 1);
    }
    .screen-card:nth-of-type(2) { transition-delay: 80ms; }
    .screen-card:nth-of-type(3) { transition-delay: 160ms; }
    .screen-card:nth-of-type(4) { transition-delay: 240ms; }

    .running .donut { --p: var(--target, 73); }
    .running .thermo i { width: var(--w, 58%); }
    .running .thermo b { transform: translateX(-50%) scaleY(1); }
    .running .splitbar i:nth-child(1) { width: var(--a, 72%); }
    .running .splitbar i:nth-child(2) { width: var(--b, 18%); }
    .running .splitbar i:nth-child(3) { width: var(--c, 10%); }
    .running .bars i { height: var(--h, 54%); }
    .running .bars i::before { opacity: 1; }
    .running .spark .line { stroke-dashoffset: 0; }
    .running .spark .area { opacity: 0.10; }
    .running .swiperow .swipe-content { transform: translateX(-88px); }
    .running .receipt { transform: rotateX(360deg); }
    .running .sheet-backdrop { background: rgba(15,26,36,0.26); pointer-events: auto; }
    .running .sheet { transform: translateY(0); }
    .running .provider-card::before { transform: scaleY(1); }
    .running .mini-meter i { width: var(--w, 76%); }
    .running .battery i { width: 68%; }
    .running .toast { transform: translateY(0); opacity: 1; }
    .running .screen-card { opacity: 1; transform: translateY(0); }

    @keyframes pop {
      0% { opacity: 0.72; transform: translateY(4px) scale(0.98); }
      70% { transform: translateY(0) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .running .pop { animation: pop 520ms cubic-bezier(0.3, 1.45, 0.35, 1) both; }

    @media (max-width: 980px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cover { grid-template-columns: 1fr; align-items: start; }
      .toolbar { justify-content: flex-start; }
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .page { padding-inline: 12px; }
      .mock-head { grid-template-columns: 1fr; }
      .run-btn { width: 100%; }
    }
  </style>

      },

      }
    ];

    const grid = document.getElementById('grid');
    grid.innerHTML = mocks.map((mock, index) => (
      '<article class="mock" data-index="' + index + '">' +
        '<div class="mock-head"><div><h2>' + mock.title + '</h2><span>' + mock.label + '</span></div><button class="run-btn" type="button">Activate animation</button></div>' +
        '<div class="stage">' + mock.body + '</div>' +
      '</article>'
    )).join('');

    function countUp(el) {
      const value = Number(el.dataset.value || 0);
      const decimals = Number(el.dataset.decimals || 0);
      const prefix = el.dataset.prefix || '';
      const suffix = el.dataset.suffix || '';
      const start = performance.now();
      const duration = 920;
      function frame(now) {
        const progress = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = prefix + (value * eased).toFixed(decimals) + suffix;
        if (progress < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function resetCard(card) {
      card.classList.remove('running');
      card.querySelector('.run-btn').classList.remove('active');
      card.querySelectorAll('.counter').forEach((el) => {
        const decimals = Number(el.dataset.decimals || 0);
        el.textContent = (el.dataset.prefix || '') + Number(0).toFixed(decimals) + (el.dataset.suffix || '');
      });
    }

    function runCard(card) {
      resetCard(card);
      card.offsetHeight;
      card.classList.add('running');
      card.querySelector('.run-btn').classList.add('active');
      card.querySelectorAll('.counter').forEach(countUp);
    }

    document.querySelectorAll('.mock').forEach((card) => {
      card.querySelector('.run-btn').addEventListener('click', () => runCard(card));
    });

    document.getElementById('runAll').addEventListener('click', () => {
      document.querySelectorAll('.mock').forEach((card, index) => {
        window.setTimeout(() => runCard(card), index * 90);
      });
    });

    document.getElementById('resetAll').addEventListener('click', () => {
      document.querySelectorAll('.mock').forEach(resetCard);
    });
  </script>
